<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Fabi's Grill · Brazilian Cousine &amp; Grill · Temple Bar, Dublin</title>
<meta name="description" content="Fabi's Grill — Authentic Brazilian cousine in the heart of Temple Bar, Dublin. Picanha, feijoada, parmegiana and much more.">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Work+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root {
    --char: #0d0906;
    --char-2: #14100b;
    --panel: #1d1610;
    --panel-2: #261c14;
    --panel-3: #2f2318;
    --line: #3d2c1d;
    --line-soft: rgba(217,168,96,0.12);
    --ember: #e2762a;
    --ember-deep: #b34d16;
    --gold: #d9a860;
    --gold-bright: #eeb75e;
    --cream: #f4ead9;
    --muted: #a89680;
    --font-display: 'Fraunces', Georgia, serif;
    --font-body: 'Work Sans', -apple-system, sans-serif;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    --transition: all 0.4s var(--ease);
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html { scroll-behavior: smooth; }

body {
    background: var(--char);
    background-image:
        radial-gradient(ellipse 1000px 600px at 50% -5%, rgba(226,118,42,0.14), transparent 60%),
        radial-gradient(ellipse 800px 500px at 90% 100%, rgba(217,168,96,0.06), transparent 60%);
    font-family: var(--font-body);
    color: var(--cream);
    overflow-x: hidden;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    touch-action: pan-x pan-y;
    min-height: 100vh; /* Garante que o fundo cubra a tela toda */
}

body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.03;
    z-index: 9999;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 500; letter-spacing: -0.01em; }

::selection { background: var(--ember); color: var(--char); }

::-webkit-scrollbar { width: 10px; height: 4px; }
::-webkit-scrollbar-track { background: var(--char-2); }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: var(--ember); }

/* ============ HERO ============ */
.hero {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 50px 30px 40px;
    min-height: 100vh; /* Faz o Hero ocupar a tela inteira */
    overflow: hidden;
}

.hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
        radial-gradient(ellipse 800px 400px at 50% 35%, rgba(226,118,42,0.15), transparent 65%),
        linear-gradient(180deg, transparent 0%, var(--char) 100%);
    z-index: 1;
}

.hero-embers {
    position: absolute;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
}
.hero-embers span {
    position: absolute;
    bottom: -10px;
    width: 3px; height: 3px;
    background: var(--ember);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--ember), 0 0 16px rgba(226,118,42,0.5);
    animation: rise linear infinite;
    opacity: 0;
}
.hero-embers span:nth-child(1) { left: 12%; animation-duration: 9s; animation-delay: 0s; }
.hero-embers span:nth-child(2) { left: 28%; animation-duration: 11s; animation-delay: 1.5s; }
.hero-embers span:nth-child(3) { left: 46%; animation-duration: 8s; animation-delay: 3s; }
.hero-embers span:nth-child(4) { left: 63%; animation-duration: 12s; animation-delay: 0.8s; }
.hero-embers span:nth-child(5) { left: 79%; animation-duration: 10s; animation-delay: 2.2s; }
.hero-embers span:nth-child(6) { left: 91%; animation-duration: 13s; animation-delay: 4s; }

@keyframes rise {
    0% { transform: translateY(0) translateX(0); opacity: 0; }
    15% { opacity: 1; }
    100% { transform: translateY(-100vh) translateX(30px); opacity: 0; }
}

.hero-content {
    position: relative;
    z-index: 3;
    max-width: 850px;
}

.hero-logo-wrap {
    position: relative;
    width: 170px;
    max-width: 55%;
    margin: 0 auto 16px;
}
.hero-logo-wrap::before {
    content: "";
    position: absolute;
    inset: -25%;
    background: radial-gradient(circle, rgba(226,118,42,0.45) 0%, rgba(226,118,42,0.12) 42%, transparent 72%);
    filter: blur(14px);
    border-radius: 50%;
    animation: embers-glow 5s ease-in-out infinite;
    z-index: 0;
}
@keyframes embers-glow {
    0%, 100% { opacity: 0.5; transform: scale(0.95); }
    50% { opacity: 0.9; transform: scale(1.06); }
}
.hero-logo {
    position: relative;
    z-index: 1;
    width: 100%;
    height: auto;
    border-radius: 16px;
    display: block;
    animation: logo-breathe 5s ease-in-out infinite;
}
@keyframes logo-breathe {
    0%, 100% { filter: drop-shadow(0 0 10px rgba(226,118,42,0.3)); }
    50% { filter: drop-shadow(0 0 22px rgba(226,118,42,0.6)); }
}

.hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 16px;
    border: 1px solid rgba(226,118,42,0.35);
    border-radius: 40px;
    font-size: 0.68rem;
    letter-spacing: 2.2px;
    text-transform: uppercase;
    color: var(--gold-bright);
    margin-bottom: 18px;
    background: rgba(226,118,42,0.06);
    backdrop-filter: blur(10px);
    animation: fadeInDown 0.9s var(--ease) both;
}
.hero-badge .dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--ember);
    animation: pulse 2s infinite;
    box-shadow: 0 0 8px var(--ember);
}
@keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(1.4); }
}

.hero h1 {
    font-size: clamp(2rem, 5vw, 3.4rem);
    font-weight: 500;
    line-height: 1.05;
    margin-bottom: 12px;
    letter-spacing: -0.02em;
    animation: fadeInUp 1.1s var(--ease) 0.2s both;
}
.hero h1 em {
    color: var(--gold-bright);
    font-style: italic;
    font-weight: 500;
}

.hero-sub {
    font-family: var(--font-display);
    font-style: italic;
    font-size: clamp(1rem, 1.4vw, 1.15rem);
    color: var(--muted);
    margin-bottom: 22px;
    font-weight: 400;
    animation: fadeInUp 1.1s var(--ease) 0.35s both;
}

.hero-meta {
    display: flex;
    gap: 20px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 26px;
    animation: fadeInUp 1.1s var(--ease) 0.5s both;
}
.hero-meta-item {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 0.78rem;
    color: var(--muted);
    letter-spacing: 0.5px;
}
.hero-meta-item i {
    color: var(--ember);
    font-size: 0.8rem;
}

.hero-actions {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
    animation: fadeInUp 1.1s var(--ease) 0.65s both;
}

.btn-primary, .btn-ghost {
    padding: 13px 28px;
    border-radius: 40px;
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    text-decoration: none;
    cursor: pointer;
    transition: var(--transition);
    border: 1px solid transparent;
    display: inline-flex;
    align-items: center;
    gap: 9px;
    font-family: var(--font-body);
}
.btn-primary {
    background: linear-gradient(135deg, var(--ember), var(--ember-deep));
    color: var(--char);
    box-shadow: 0 8px 22px rgba(226,118,42,0.35);
}
.btn-primary:hover {
    transform: translateY(-3px);
    box-shadow: 0 14px 32px rgba(226,118,42,0.5);
    filter: brightness(1.08);
}
.btn-ghost {
    background: transparent;
    color: var(--cream);
    border-color: rgba(217,168,96,0.3);
}
.btn-ghost:hover {
    border-color: var(--ember);
    color: var(--gold-bright);
    transform: translateY(-3px);
}

@keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }

/* ============ RESPONSIVIDADE ============ */
@media (max-width: 768px) {
    .hero { padding: 40px 20px 30px; }
    .hero-logo-wrap { width: 140px; }
    .hero-actions { flex-direction: column; align-items: center; }
    .btn-primary, .btn-ghost { width: 100%; max-width: 280px; justify-content: center; }
    .hero-meta { gap: 12px; }
    .hero-meta-item { font-size: 0.72rem; }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
    }
    .hero-embers { display: none; }
}

:focus-visible {
    outline: 2px solid var(--ember);
    outline-offset: 3px;
    border-radius: 4px;
}
</style>
</head>
<body>

<!-- HERO (Apenas a parte do print) -->

</body>
</html>
